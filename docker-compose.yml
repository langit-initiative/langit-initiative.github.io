name: langit
services:
  nginx:
    image: bitnami/nginx:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - ./:/var/www/html
      - ./conf/vhost.conf:/opt/bitnami/nginx/conf/server_blocks/vhost.conf
      - /etc/localtime:/etc/localtime
    networks:
      - app-network
    logging:
      driver: json-file
networks:
  app-network:
    driver: bridge
